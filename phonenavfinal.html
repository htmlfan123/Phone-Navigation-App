<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Navigation App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #070a13;
      color: #fff;
      overscroll-behavior: none;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      z-index: 1;
    }

    /* Elegant UI Overlays */
    .nav-panel {
      position: absolute;
      left: 16px;
      right: 16px;
      background: rgba(20, 24, 39, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      z-index: 1000;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Unified Search Bar System */
    #searchContainer {
      top: 16px;
      padding: 8px;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      background: #1e2538;
      border-radius: 12px;
      padding: 4px 12px;
    }

    #searchInput {
      flex: 1;
      border: none;
      background: transparent;
      color: #fff;
      padding: 10px 4px;
      font-size: 16px;
      outline: none;
    }

    #searchInput::placeholder {
      color: #717b99;
    }

    /* Live Autocomplete Dropdown List */
    #suggestionsList {
      background: transparent;
      max-height: 240px;
      overflow-y: auto;
      margin-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .suggestion-item {
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggest-title {
      font-weight: 600;
      font-size: 14px;
      color: #f3f4f6;
    }

    .suggest-subtitle {
      font-size: 12px;
      color: #8e9aa8;
      margin-top: 2px;
    }

    /* Driving HUD Banner */
    #hudContainer {
      bottom: 16px;
      padding: 16px;
      display: none; /* Only reveals while driving */
    }

    #nextInstruction {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    #statusMessage {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 14px;
    }

    .hud-metrics {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 12px;
    }

    .metric-group {
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #6b7280;
      letter-spacing: 0.05em;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    #stopBtn {
      background: #ef4444;
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    /* Map Camera Control Utilities */
    #recenterBtn {
      position: absolute;
      bottom: 165px;
      right: 16px;
      z-index: 1001;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      display: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .leaflet-container { background: #070a13; }
    .leaflet-map-pane { transition: transform 0.25s linear; }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <div id="searchContainer" class="nav-panel">
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Search address, destination, or places..." autocomplete="off" />
      </div>
      <div id="suggestionsList"></div>
    </div>

    <button id="recenterBtn">Recenter</button>

    <div id="hudContainer" class="nav-panel">
      <div id="nextInstruction">Proceed to highlighted route</div>
      <div id="statusMessage">Searching GPS position...</div>
      
      <div class="hud-metrics">
        <div class="metric-group">
          <span class="metric-label">Distance</span>
          <span id="hudDistance" class="metric-value">–</span>
        </div>
        <div class="metric-group">
          <span class="metric-label">Time</span>
          <span id="hudTime" class="metric-value">–</span>
        </div>
        <div class="metric-group">
          <span class="metric-label">Speed</span>
          <span id="hudSpeed" class="metric-value">0 mph</span>
        </div>
        <button id="stopBtn">End</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
